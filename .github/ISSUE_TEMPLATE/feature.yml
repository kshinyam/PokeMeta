name: Feature or milestone
description: Propose a product, data, scoring, or infrastructure improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Describe the user or engineering problem before proposing the implementation.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What limitation or user need does this address?
      placeholder: The current application requires...
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What observable outcome should this work create?
    validations:
      required: true

  - type: textarea
    id: approach
    attributes:
      label: Proposed approach
      description: Describe the likely implementation and important alternatives.

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List the conditions that must be true before this is complete.
      placeholder: |
        - [ ] First measurable condition
        - [ ] Tests cover the new behavior
        - [ ] Documentation is updated
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence and validation
      description: How will we determine whether this is correct or useful?

  - type: textarea
    id: risks
    attributes:
      label: Risks or open questions
      description: Note assumptions, uncertainty, or data-quality concerns.
